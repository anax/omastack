
networks:
  omastack-net:
    external: true

services:
  grafana:
    image: grafana/grafana-oss:latest
    container_name: omastack-obs-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${OMASTACK_DB_PASS:-adminpassword}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${PORT_GRAFANA:-3001}:3000"
    networks:
      - omastack-net

  prometheus:
    image: prom/prometheus:latest
    container_name: omastack-obs-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.listen-address=127.0.0.1:9090"
    network_mode: "service:grafana"
    depends_on:
      - grafana

  loki:
    image: grafana/loki:latest
    container_name: omastack-obs-loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/local-config.yaml"
      - "-server.http-listen-address=127.0.0.1"
      - "-server.grpc-listen-address=127.0.0.1"
    network_mode: "service:grafana"
    depends_on:
      - grafana

  redis:
    image: redis:alpine
    container_name: omastack-obs-redis
    restart: unless-stopped
    command: redis-server --requirepass '${OMASTACK_SECRET_KEY:-adminpassword}'
    ports:
      - "127.0.0.1:${PORT_REDIS:-6379}:6379"
    networks:
      - omastack-net
