
networks:
  omastack-net:
    external: true

services:
  mysql:
    image: mysql:8.0
    container_name: omastack-laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: '${DB_DATABASE:-laravel}'
      MYSQL_USER: '${DB_USERNAME:-laravel}'
      MYSQL_PASSWORD: '${OMASTACK_DB_PASS:-secret}'
      MYSQL_ROOT_PASSWORD: '${OMASTACK_DB_PASS:-secret}'
    ports:
      - "127.0.0.1:${PORT_MYSQL:-3306}:3306"
    networks:
      - omastack-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: omastack-laravel-redis
    restart: unless-stopped
    command: redis-server --requirepass '${OMASTACK_SECRET_KEY:-secret}'
    environment:
      - REDISCLI_AUTH=${OMASTACK_SECRET_KEY:-secret}
    ports:
      - "127.0.0.1:${PORT_REDIS:-6379}:6379"
    networks:
      - omastack-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: omastack-laravel-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT_MAILPIT_HTTP:-8025}:8025"
      - "127.0.0.1:${PORT_MAILPIT_SMTP:-1025}:1025"
    networks:
      - omastack-net

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: omastack-laravel-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: '${OMASTACK_SECRET_KEY:-masterKey123}'
      MEILI_ENV: 'development'
    ports:
      - "127.0.0.1:${PORT_MEILI:-7700}:7700"
    networks:
      - omastack-net
