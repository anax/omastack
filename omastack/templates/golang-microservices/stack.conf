# stack.conf - Metadata and Default Ports for golang-microservices
STACK_NAME="golang-microservices"
STACK_DESCRIPTION="Go & Rust Microservices Stack: RabbitMQ Event Broker, Jaeger Tracing, PostgreSQL 16 & Redis"
PORT_POSTGRES=5432
PORT_RABBITMQ_AMQP=5672
PORT_RABBITMQ_UI=15672
PORT_JAEGER_UI=16686
PORT_JAEGER_OTLP=4317
PORT_REDIS=6379

DOMAIN_MQ="mq.oma.local:PORT_RABBITMQ_UI"
DOMAIN_TRACES="traces.oma.local:PORT_JAEGER_UI"
