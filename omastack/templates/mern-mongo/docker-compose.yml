version: '3.8'

networks:
  omastack-net:
    external: true

services:
  mongodb:
    image: mongo:7
    container_name: omastack-mern-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${OMASTACK_DB_PASS:-mongopassword}
    ports:
      - "127.0.0.1:${PORT_MONGO:-27017}:27017"
    networks:
      - omastack-net

  mongo-express:
    image: mongo-express:latest
    container_name: omastack-mern-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${OMASTACK_DB_PASS:-mongopassword}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "127.0.0.1:${PORT_MONGO_EXPRESS:-8081}:8081"
    networks:
      - omastack-net

  redis:
    image: redis:alpine
    container_name: omastack-mern-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT_REDIS:-6379}:6379"
    networks:
      - omastack-net
